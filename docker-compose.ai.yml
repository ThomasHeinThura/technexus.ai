# Static sites behind the existing maria-edge Traefik.
# Matches the label pattern used by maria-one-api (entrypoint websecure, certresolver le).
services:

  # ---- Public portfolio: ai.technexus.info -------------------------------
  ai-site:
    image: nginx:1.27-alpine
    container_name: ai-site
    restart: unless-stopped
    networks: [web]
    volumes:
      - ./ai:/usr/share/nginx/html:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.aisite.rule: "Host(`ai.technexus.info`)"
      traefik.http.routers.aisite.entrypoints: "websecure"
      traefik.http.routers.aisite.tls.certresolver: "le"
      traefik.http.services.aisite.loadbalancer.server.port: "80"
      # security headers
      traefik.http.middlewares.aisec.headers.stsSeconds: "31536000"
      traefik.http.middlewares.aisec.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.aisec.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.aisec.headers.frameDeny: "true"
      traefik.http.middlewares.aisec.headers.referrerPolicy: "strict-origin-when-cross-origin"
      # always revalidate HTML so a rebuild is never masked by a stale browser copy
      traefik.http.middlewares.aisec.headers.customResponseHeaders.Cache-Control: "no-cache, must-revalidate"
      traefik.http.routers.aisite.middlewares: "aisec"

networks:
  web:
    external: true
